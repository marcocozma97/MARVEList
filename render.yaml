databases:
  - name: marvelist-db
    plan: free
    region: frankfurt
    databaseName: marvelist
    user: marvelist

services:
  - type: web
    name: marvelist-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: marvelist-backend
    dockerfilePath: ./marvelist-backend/Dockerfile
    dockerContext: ./marvelist-backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marvelist-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: marvelist-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: marvelist-db
          property: password
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://marvelist-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://marvelist-frontend.onrender.com
      - key: SHOW_SQL
        value: "false"

  - type: web
    name: marvelist-frontend
    runtime: static
    rootDir: marvelist-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://marvelist-backend.onrender.com/api/v1
      - key: VITE_TMDB_API_KEY
        sync: false
