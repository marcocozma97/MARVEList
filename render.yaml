services:
  - type: web
    name: marvelist-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: marvelist-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://marvelist-eta.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://marvelist-eta.vercel.app
      - key: SHOW_SQL
        value: "false"
