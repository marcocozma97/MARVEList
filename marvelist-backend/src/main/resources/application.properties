spring.application.name=marvelist-backend

# Carica i segreti dal file .env nella root del progetto (escluso da git)
spring.config.import=optional:file:.env[.properties]

# Configurazione Database PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marvelist}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurazione JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:true}

# Porta del server Backend
server.port=${PORT:8080}


# Configurazione JWT (Sicurezza)

# Chiave segreta (256-bit, base64 encoded)
application.security.jwt.secret-key=${JWT_SECRET_KEY}
# Scadenza del token: 86400000 millisecondi = 24 ore
application.security.jwt.expiration=86400000


# Configurazione API TMDB

tmdb.api.url=https://api.themoviedb.org/3
tmdb.api.key=${TMDB_API_KEY}


# Configurazione J.A.I.R.V.I.S. (OpenRouter)

openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.api.key=${OPENROUTER_API_KEY}


# Notizie del Daily Bugle (feed RSS di Google News in italiano, ultimi 14 giorni)

news.feed.url=https://news.google.com/rss/search
news.feed.query=Marvel (MCU OR film OR serie OR Disney) when:14d


# Configurazione Email (conferma registrazione)
# Invio tramite API HTTPS di Brevo: BREVO_API_KEY e' la chiave API dell'account Brevo.

# Indirizzo del frontend per il link di conferma, usato solo se la richiesta non arriva da un'origine ammessa
application.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Origini ammesse dal CORS (separate da virgola, accettano *): localhost e qualsiasi PC della rete di casa
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://192.168.*.*:5173}
# Validita' del link di conferma (ore)
application.verification.expiration-hours=24

# API Brevo
brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=${BREVO_API_KEY}
application.mail.from=${MAIL_FROM:marcocozma97@gmail.com}
application.mail.logo-url=${MAIL_LOGO_URL:https://marvelist-frontend.onrender.com/email/marvelist-logo.png}
